<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM OIL - ONLINE V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0f0f0f;color:#fff;font-size:13px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#181818;border-bottom:1px solid #333;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#fff,#c79a5d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px}
.page{padding:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#1c1c1c;border:1px solid #333;padding:12px 10px;border-radius:12px;cursor:pointer;transition:.25s;position:relative;min-height:105px}
.card:hover{border-color:#c79a5d;transform:translateY(-2px);background:#222}
.icon{font-size:54px;margin-bottom:8px}
.cat-name{font-weight:700;font-size:13px}
.brand-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.back-small{background:#222;border:1px solid #333;color:#c79a5d;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:5px;margin-top:8px}
.brand-card{background:#1c1c1c;border:1px solid #333;padding:9px 6px;border-radius:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;position:relative;min-height:40px;display:flex;align-items:center;justify-content:center}
.brand-card:hover{border-color:#c79a5d;background:#222}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#1a1a1a;border-radius:10px;overflow:hidden}
th{text-align:left;padding:8px 6px;background:#222;color:#c79a5d;font-size:11px;text-transform:uppercase}
td{padding:7px 6px;border-top:1px solid #2a2a2a;font-size:13px}
.btn{padding:7px 12px;background:#c79a5d;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}
.admin-bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
input{background:#222;border:1px solid #444;color:#fff;padding:6px 8px;border-radius:5px;font-size:12px}
.del{position:absolute;top:3px;right:4px;background:#2a2a2a;border:none;color:#ff4444;width:16px;height:16px;border-radius:50%;cursor:pointer;font-weight:900}
.online{font-size:10px;color:#00ff88;margin-left:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="header"><div class="logo">STORM OIL <span class="online">● ONLINE V2</span></div><button onclick="toggleAdmin()" id="adminBtn" style="background:none;border:1px solid #444;color:#aaa;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px">Адм</button></div>
<div class="page" id="app">Проверка базы...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCaOuFbbEACUF2jRdlIxJQUNUGfD4gUSeE",
  authDomain: "storm-oil.firebaseapp.com",
  projectId: "storm-oil",
  storageBucket: "storm-oil.firebasestorage.app",
  messagingSenderId: "81277457617",
  appId: "1:81277457617:web:00f20b7e3f9e33d13461f0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let isAdmin = localStorage.getItem('storm_admin')==='1';
let currentCat=null, currentBrand=null;

async function migrateIfNeeded(){
  const oldRef = await db.collection('storm').doc('data').get();
  if(!oldRef.exists) return false;
  if(localStorage.getItem('migrated_v2')==='1') return false;
  const old = oldRef.data();
  if(!old.categories) return false;
  document.getElementById('app').innerHTML = `<h2>Идет перенос старой базы... Не закрывай</h2>`;
  let count=0;
  const batch = db.batch();
  for(let c of old.categories){
    const ref = db.collection('categories').doc(String(c.id));
    batch.set(ref, c);
    const brands = old.brands[c.id] || [];
    for(let b of brands){
      const bRef = db.collection('brands').doc(`${c.id}_${b}`);
      batch.set(bRef, {name:b, categoryId:c.id});
    }
  }
  await batch.commit();
  let batch2 = db.batch(); let i=0;
  for(let key in old.products){
    for(let p of old.products[key]){
      const parts = key.split('_');
      const catId = parseInt(parts[0]);
      const brand = key.substring(String(catId).length+1);
      const pRef = db.collection('products').doc(String(p.id));
      batch2.set(pRef, {name:p.name, volume:p.volume, price:p.price, categoryId:catId, brand:brand, id:p.id});
      count++; i++;
      if(i>400){ await batch2.commit(); batch2=db.batch(); i=0; }
    }
  }
  if(i>0) await batch2.commit();
  localStorage.setItem('migrated_v2','1');
  document.getElementById('app').innerHTML = `<h2 style="color:#00ff88">Перенос готов! Перенесено ${count} товаров</h2><p style="margin-top:10px">Старая база сохранена как резерв. Теперь сайт безлимитный.</p><button class="btn" style="margin-top:12px" onclick="load()">Продолжить</button>`;
  return true;
}

async function load(){
  const migrated = await migrateIfNeeded();
  if(migrated) return;
  renderCategories();
}
async function renderCategories(){
  currentCat=null; currentBrand=null;
  const snap = await db.collection('categories').get();
  let cats = [];
  if(snap.empty){
    const defaults=[{id:1,name:'Моторное масло',icon:'🚗'},{id:2,name:'Дизельное масло',icon:'🚛'},{id:3,name:'Трансмиссионное масло',icon:'⚙️'},{id:4,name:'Гидравлическое масло',icon:'💧'},{id:5,name:'Компрессорное масло',icon:'🌀'},{id:6,name:'Автохимия',icon:'🧪'},{id:7,name:'Смазки',icon:'🧴'},{id:8,name:'Мото масло',icon:'🏍️'},{id:9,name:'Антифриз',icon:'❄️'}];
    for(let c of defaults){ await db.collection('categories').doc(String(c.id)).set(c); cats.push(c); }
  } else { snap.forEach(d=>cats.push(d.data())); }
  cats.sort((a,b)=>a.id-b.id);
  document.getElementById('app').innerHTML=`<h1>Категории • ${cats.length}</h1>${isAdmin?`<div class="admin-bar"><input id="newCat" placeholder="Новая категория"><button class="btn" onclick="addCategory()">+ Добавить</button></div>`:''}<div class="grid">${cats.map(c=>`<div class="card" onclick="openCategory(${c.id})"><div class="icon">${c.icon||'📦'}</div><div class="cat-name">${c.name}</div>${isAdmin?`<button class="del" style="top:6px;right:7px;width:22px;height:22px" onclick="event.stopPropagation();delCategory(${c.id})">✕</button>`:''}</div>`).join('')}</div>`;
}
async function addCategory(){const el=document.getElementById('newCat');const name=el.value.trim();if(!name) return;const id=Date.now();await db.collection('categories').doc(String(id)).set({id,name,icon:'📦'});renderCategories();}
async function delCategory(id){if(!confirm('Удалить категорию?')) return; await db.collection('categories').doc(String(id)).delete(); const bSnap=await db.collection('brands').where('categoryId','==',id).get(); bSnap.forEach(d=>d.ref.delete()); renderCategories();}
async function openCategory(id){
  const cDoc=await db.collection('categories').doc(String(id)).get(); currentCat=cDoc.data();
  const snap=await db.collection('brands').where('categoryId','==',id).get();
  let brands=[]; snap.forEach(d=>brands.push(d.data().name)); brands.sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${currentCat.icon||''} ${currentCat.name}</h1><div class="back-small" onclick="renderCategories()">← к категориям</div></div><p style="color:#888;margin-bottom:8px">Брендов: ${brands.length} </p>${isAdmin?`<div class="admin-bar"><input id="newBrand" placeholder="Новый бренд"><button class="btn" onclick="addBrand()">+ Бренд</button></div>`:''}<div class="brand-grid">${brands.map(b=>`<div class="brand-card" onclick="openBrand('${b.replace(/'/g,"\\'")}')">${b}${isAdmin?`<button class="del" onclick="event.stopPropagation();delBrand('${b.replace(/'/g,"\\'")}')">✕</button>`:''}</div>`).join('')}</div>`;
}
async function addBrand(){const el=document.getElementById('newBrand');const name=el.value.trim();if(!name) return; await db.collection('brands').doc(`${currentCat.id}_${name}`).set({name, categoryId:currentCat.id}); openCategory(currentCat.id);}
async function delBrand(b){if(!confirm(`Удалить ${b}?`)) return; await db.collection('brands').doc(`${currentCat.id}_${b}`).delete(); openCategory(currentCat.id);}
async function openBrand(brand){
  currentBrand=brand;
  const snap=await db.collection('products').where('categoryId','==',currentCat.id).where('brand','==',brand).get();
  let list=[]; snap.forEach(d=>list.push(d.data())); list.sort((a,b)=>a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${brand} <span style="color:#888;font-size:12px">[${currentCat.name}]</span></h1><div class="back-small" onclick="openCategory(${currentCat.id})">← к брендам</div></div><input id="sProd" oninput="filterProd()" placeholder="Поиск..." style="width:100%;margin-top:8px;padding:8px"><div class="admin-bar"><input id="pName" placeholder="Название"><input id="pVol" placeholder="Объем" style="width:70px"><input id="pPrice" placeholder="Цена" style="width:80px"><button class="btn" onclick="addProd()">+ Товар</button></div><table><thead><tr><th>№</th><th>Название</th><th>Объем</th><th>Цена</th><th></th></tr></thead><tbody id="tbody">${list.map((p,i)=>`<tr data-name="${p.name.toLowerCase()}"><td>${i+1}</td><td>${p.name}</td><td>${p.volume}</td><td>${isAdmin?`<input value="${p.price}" onchange="updPrice(${p.id},this.value)" style="width:70px">`:p.price+' ₸'}</td><td>${isAdmin?`<button onclick="delProd(${p.id})" style="background:none;border:none;color:#f44;cursor:pointer;font-weight:900">✕</button>`:''}</td></tr>`).join('')}</tbody></table>`;
}
function filterProd(){const q=document.getElementById('sProd').value.toLowerCase();document.querySelectorAll('#tbody tr').forEach(tr=>{tr.style.display=tr.dataset.name.includes(q)?'':'none'})}
async function addProd(){
  const n=document.getElementById('pName').value.trim();
  const v=document.getElementById('pVol').value.trim();
  const pr=document.getElementById('pPrice').value.trim();
  if(!n) return;
  const id=Date.now();
  await db.collection('products').doc(String(id)).set({id,name:n,volume:v||'-',price:pr||'0',categoryId:currentCat.id,brand:currentBrand});
  openBrand(currentBrand);
}
async function delProd(id){ if(!confirm('Удалить?')) return; await db.collection('products').doc(String(id)).delete(); openBrand(currentBrand); }
async function updPrice(id,val){ await db.collection('products').doc(String(id)).update({price:val}); }
function toggleAdmin(){if(!isAdmin){let l=prompt("Логин:");let p=prompt("Пароль:");if(l==="admin" && p==="Storm123"){isAdmin=true;localStorage.setItem('storm_admin','1');} else {alert("Неверно");return;}} else {isAdmin=false;localStorage.setItem('storm_admin','0');}document.getElementById('adminBtn').innerText=isAdmin?'Выйти':'Адм';if(currentBrand) openBrand(currentBrand); else if(currentCat) openCategory(currentCat.id); else renderCategories();}
window.onload=()=>{if(isAdmin) document.getElementById('adminBtn').innerText='Выйти';load();};
</script>
</body>
</html>
