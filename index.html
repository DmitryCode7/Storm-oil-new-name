<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM OIL - ONLINE V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0f0f0f;color:#fff;font-size:13px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#181818;border-bottom:1px solid #333;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#fff,#c79a5d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1.5px}
.tabs{display:flex;gap:8px;padding:10px 20px;background:#181818;border-bottom:1px solid #333;position:sticky;top:53px;z-index:9}
.tab-btn{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-weight:800;cursor:pointer;font-size:13px}
.tab-btn.active{background:#c79a5d;color:#000;border-color:#c79a5d}
.page{padding:16px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#1c1c1c;border:1px solid #333;padding:12px 10px;border-radius:12px;cursor:pointer;transition:.25s;position:relative;min-height:105px}
.card:hover{border-color:#c79a5d;transform:translateY(-2px);background:#222}
.icon{font-size:54px;margin-bottom:8px}
.cat-name{font-weight:700;font-size:13px}
.brand-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.back-small{background:#222;border:1px solid #333;color:#c79a5d;padding:7px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:5px;margin-top:8px}
.brand-card{background:#1c1c1c;border:1px solid #333;padding:9px 6px;border-radius:10px;text-align:center;font-weight:700;font-size:13px;cursor:pointer;position:relative;min-height:40px;display:flex;align-items:center;justify-content:center}
.brand-card:hover{border-color:#c79a5d;background:#222}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#1a1a1a;border-radius:10px;overflow:hidden}
th{text-align:left;padding:8px 6px;background:#222;color:#c79a5d;font-size:11px;text-transform:uppercase}
td{padding:7px 6px;border-top:1px solid #2a2a2a;font-size:13px}
.btn{padding:7px 12px;background:#c79a5d;color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px}
.admin-bar{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
input{background:#222;border:1px solid #444;color:#fff;padding:6px 8px;border-radius:5px;font-size:12px}
.del{position:absolute;top:3px;right:4px;background:#2a2a2a;border:none;color:#ff4444;width:16px;height:16px;border-radius:50%;cursor:pointer;font-weight:900}
.online{font-size:10px;color:#00ff88;margin-left:8px}
.qty-btn{background:#222;border:1px solid #444;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:900;font-size:16px;line-height:1}
.qty-btn:hover{border-color:#c79a5d;color:#c79a5d}
.qty-btn:active{transform:scale(.92)}
.qty-num{font-weight:800;font-size:16px;min-width:36px;display:inline-block;text-align:center}
.choice-btn{width:100%;padding:22px;border-radius:14px;border:1px solid #333;background:#1c1c1c;color:#fff;font-weight:800;font-size:18px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:12px}
.choice-btn:hover{border-color:#c79a5d;background:#222}
.choice-btn span{font-size:32px}
.filter-switch{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.filter-switch button{flex:1;padding:9px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-weight:800;cursor:pointer;font-size:12px}
.filter-switch button.active{background:#c79a5d;color:#000;border-color:#c79a5d}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="header"><div class="logo">STORM OIL <span class="online">● ONLINE V2</span></div><button onclick="toggleAdmin()" id="adminBtn" style="background:none;border:1px solid #444;color:#aaa;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:11px">Адм</button></div>
<div class="tabs"><button class="tab-btn active" id="tabCatBtn" onclick="renderCategories()">КАТЕГОРИИ</button><button class="tab-btn" id="tabFiltBtn" onclick="openFilters()">🔧 ФИЛЬТРА</button></div>
<div class="page" id="app">Проверка базы...</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCaOuFbbEACUF2jRdlIxJQUNUGfD4gUSeE",
  authDomain: "storm-oil.firebaseapp.com",
  projectId: "storm-oil",
  storageBucket: "storm-oil.firebasestorage.app",
  messagingSenderId: "81277457617",
  appId: "1:81277457617:web:00f20b7e3f9e33d13461f0"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
// БЫСТРО: офлайн-кэш - второй заход мгновенный
try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
let isAdmin = false;
let currentCat=null, currentBrand=null;
let viewingFilters=false;
let currentFilterType=null;
let authReady=false;
// КЭШ - чтобы не качать одно и то же каждый раз
let cacheCats=null, cacheBrands={}, cacheProducts={}, cacheFilters={};

function setTab(active){
  document.getElementById('tabCatBtn').classList.toggle('active', active==='cat');
  document.getElementById('tabFiltBtn').classList.toggle('active', active==='filters');
}

// ПО ПОРЯДКУ: натуральная сортировка SB 95 < SB 200 < SB 874 < SB 2051
function naturalCompare(a,b){
  a=(a||'').toString().toLowerCase(); b=(b||'').toString().toLowerCase();
  const ax=a.match(/(\d+|\D+)/g)||[a]; const bx=b.match(/(\d+|\D+)/g)||[b];
  const len=Math.max(ax.length,bx.length);
  for(let i=0;i<len;i++){
    const x=ax[i]||''; const y=bx[i]||'';
    if(x===y) continue;
    if(/^\d+$/.test(x) && /^\d+$/.test(y)) return parseInt(x,10)-parseInt(y,10);
    return x.localeCompare(y);
  }
  return 0;
}
function withTimeout(p,ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('Таймаут '+ms+'мс')),ms))]); }

// ИСПРАВЛЕНО: миграция больше не может повесить сайт
async function migrateIfNeeded(){
  try{
    if(localStorage.getItem('migrated_v2')==='1') return false;
    const oldRef = await db.collection('storm').doc('data').get();
    if(!oldRef.exists) return false;
    const old = oldRef.data();
    if(!old.categories) return false;
    document.getElementById('app').innerHTML = `<h2>Идет перенос старой базы... Не закрывай</h2>`;
    let count=0;
    const batch = db.batch();
    for(let c of old.categories){
      const ref = db.collection('categories').doc(String(c.id));
      batch.set(ref, c);
      const brands = old.brands[c.id] || [];
      for(let b of brands){
        const bRef = db.collection('brands').doc(`${c.id}_${b}`);
        batch.set(bRef, {name:b, categoryId:c.id});
      }
    }
    await batch.commit();
    let batch2 = db.batch(); let i=0;
    for(let key in old.products){
      for(let p of old.products[key]){
        const parts = key.split('_');
        const catId = parseInt(parts[0]);
        const brand = key.substring(String(catId).length+1);
        const pRef = db.collection('products').doc(String(p.id));
        batch2.set(pRef, {name:p.name, volume:p.volume, price:p.price, categoryId:catId, brand:brand, id:p.id});
        count++; i++;
        if(i>400){ await batch2.commit(); batch2=db.batch(); i=0; }
      }
    }
    if(i>0) await batch2.commit();
    localStorage.setItem('migrated_v2','1');
    document.getElementById('app').innerHTML = `<h2 style="color:#00ff88">Перенос готов! Перенесено ${count} товаров</h2><p style="margin-top:10px">Старая база сохранена как резерв. Теперь сайт безлимитный.</p><button class="btn" style="margin-top:12px" onclick="load()">Продолжить</button>`;
    return true;
  }catch(e){
    console.log('Миграция пропущена:', e.message);
    return false;
  }
}

async function load(){
  try{
    const migrated = await migrateIfNeeded();
    if(migrated) return;
  }catch(e){ console.log('load error', e); }
  renderCategories();
}
async function renderCategories(force=false){
  currentCat=null; currentBrand=null; viewingFilters=false; currentFilterType=null; setTab('cat');
  // БЫСТРО: если уже качали - показываем сразу из кэша
  if(cacheCats && !force){ drawCats(cacheCats); return; }
  try{
    const snap = await withTimeout(db.collection('categories').get(),4000);
    let cats = [];
    if(snap.empty){
      const defaults=[{id:1,name:'Моторное масло',icon:'🚗'},{id:2,name:'Дизельное масло',icon:'🚛'},{id:3,name:'Трансмиссионное масло',icon:'⚙️'},{id:4,name:'Гидравлическое масло',icon:'💧'},{id:5,name:'Компрессорное масло',icon:'🌀'},{id:6,name:'Автохимия',icon:'🧪'},{id:7,name:'Смазки',icon:'🧴'},{id:8,name:'Мото масло',icon:'🏍️'},{id:9,name:'Антифриз',icon:'❄️'}];
      for(let c of defaults){ try{ await db.collection('categories').doc(String(c.id)).set(c); }catch(e){} cats.push(c); }
    } else { snap.forEach(d=>cats.push(d.data())); }
    cats.sort((a,b)=>a.id-b.id);
    cacheCats=cats; drawCats(cats);
  }catch(e){
    if(cacheCats){ drawCats(cacheCats); return; }
    document.getElementById('app').innerHTML=`<h2 style="color:#ff4444">Нет связи с базой</h2><p style="color:#888;margin:10px 0">${e.message}</p><p style="color:#888">Проверь интернет и правила Firestore. Попробуй обновить страницу.</p><button class="btn" style="margin-top:12px" onclick="renderCategories(true)">↻ Повторить</button>`;
  }
}
function drawCats(cats){
  document.getElementById('app').innerHTML=`<h1>Категории • ${cats.length}</h1>${isAdmin?`<div class="admin-bar"><input id="newCat" placeholder="Новая категория"><button class="btn" onclick="addCategory()">+ Добавить</button></div>`:''}<div class="grid">${cats.map(c=>`<div class="card" onclick="openCategory(${c.id})"><div class="icon">${c.icon||'📦'}</div><div class="cat-name">${c.name}</div>${isAdmin?`<button class="del" style="top:6px;right:7px;width:22px;height:22px" onclick="event.stopPropagation();delCategory(${c.id})">✕</button>`:''}</div>`).join('')}</div>`;
}
async function addCategory(){const el=document.getElementById('newCat');const name=el.value.trim();if(!name) return;const id=Date.now();await db.collection('categories').doc(String(id)).set({id,name,icon:'📦'});cacheCats=null;renderCategories();}
async function delCategory(id){if(!confirm('Удалить категорию?')) return; await db.collection('categories').doc(String(id)).delete(); const bSnap=await db.collection('brands').where('categoryId','==',id).get(); bSnap.forEach(d=>d.ref.delete()); cacheCats=null; delete cacheBrands[id]; renderCategories();}
async function openCategory(id){
  viewingFilters=false; currentFilterType=null; setTab('cat');
  if(cacheBrands[id]){ currentCat=cacheBrands[id].cat; drawBrands(cacheBrands[id].brands); return; }
  const cDoc=await withTimeout(db.collection('categories').doc(String(id)).get(),4000); currentCat=cDoc.data();
  const snap=await withTimeout(db.collection('brands').where('categoryId','==',id).get(),4000);
  let brands=[]; snap.forEach(d=>brands.push(d.data().name)); brands.sort((a,b)=>naturalCompare(a,b));
  cacheBrands[id]={cat:currentCat, brands}; drawBrands(brands);
}
function drawBrands(brands){
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${currentCat.icon||''} ${currentCat.name}</h1><div class="back-small" onclick="renderCategories()">← к категориям</div></div><p style="color:#888;margin-bottom:8px">Брендов: ${brands.length} </p>${isAdmin?`<div class="admin-bar"><input id="newBrand" placeholder="Новый бренд"><button class="btn" onclick="addBrand()">+ Бренд</button></div>`:''}<div class="brand-grid">${brands.map(b=>`<div class="brand-card" onclick="openBrand('${b.replace(/'/g,"\\'")}')">${b}${isAdmin?`<button class="del" onclick="event.stopPropagation();delBrand('${b.replace(/'/g,"\\'")}')">✕</button>`:''}</div>`).join('')}</div>`;
}
async function addBrand(){const el=document.getElementById('newBrand');const name=el.value.trim();if(!name) return; await db.collection('brands').doc(`${currentCat.id}_${name}`).set({name, categoryId:currentCat.id}); delete cacheBrands[currentCat.id]; openCategory(currentCat.id);}
async function delBrand(b){if(!confirm(`Удалить ${b}?`)) return; await db.collection('brands').doc(`${currentCat.id}_${b}`).delete(); delete cacheBrands[currentCat.id]; openCategory(currentCat.id);}
async function openBrand(brand){
  viewingFilters=false; currentFilterType=null; setTab('cat');
  currentBrand=brand;
  const key=currentCat.id+'_'+brand;
  if(cacheProducts[key]){ drawProducts(brand, cacheProducts[key]); return; }
  const snap=await withTimeout(db.collection('products').where('categoryId','==',currentCat.id).where('brand','==',brand).get(),5000);
  let list=[]; snap.forEach(d=>list.push(d.data())); list.sort((a,b)=>naturalCompare(a.name,b.name));
  cacheProducts[key]=list; drawProducts(brand, list);
}
function drawProducts(brand, list){
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${brand} <span style="color:#888;font-size:12px">[${currentCat.name}]</span></h1><div class="back-small" onclick="openCategory(${currentCat.id})">← к брендам</div></div><input id="sProd" oninput="filterProd()" placeholder="Поиск..." style="width:100%;margin-top:8px;padding:8px">${isAdmin?`<div class="admin-bar"><input id="pName" placeholder="Название"><input id="pVol" placeholder="Объем" style="width:70px"><input id="pPrice" placeholder="Цена" style="width:80px"><button class="btn" onclick="addProd()">+ Товар</button></div>`:''}<table><thead><tr><th>№</th><th>Название</th><th>Объем</th><th>Цена</th><th></th></tr></thead><tbody id="tbody">${list.map((p,i)=>`<tr data-name="${p.name.toLowerCase()}"><td>${i+1}</td><td>${p.name}</td><td>${p.volume}</td><td>${isAdmin?`<input value="${p.price}" onchange="updPrice(${p.id},this.value)" style="width:70px">`:p.price+' ₸'}</td><td>${isAdmin?`<button onclick="delProd(${p.id})" style="background:none;border:none;color:#f44;cursor:pointer;font-weight:900">✕</button>`:''}</td></tr>`).join('')}</tbody></table>`;
}
function filterProd(){const q=document.getElementById('sProd').value.toLowerCase();document.querySelectorAll('#tbody tr').forEach(tr=>{tr.style.display=tr.dataset.name.includes(q)?'':'none'})}
async function addProd(){
  const n=document.getElementById('pName').value.trim();
  const v=document.getElementById('pVol').value.trim();
  const pr=document.getElementById('pPrice').value.trim();
  if(!n) return;
  const id=Date.now();
  await db.collection('products').doc(String(id)).set({id,name:n,volume:v||'-',price:pr||'0',categoryId:currentCat.id,brand:currentBrand});
  delete cacheProducts[currentCat.id+'_'+currentBrand];
  openBrand(currentBrand);
}
async function delProd(id){ if(!confirm('Удалить?')) return; await db.collection('products').doc(String(id)).delete(); delete cacheProducts[currentCat.id+'_'+currentBrand]; openBrand(currentBrand); }
async function updPrice(id,val){ await db.collection('products').doc(String(id)).update({price:val}); }

// ===== ФИЛЬТРА - БЕЗ БЛОКИРУЮЩЕГО ОКНА =====
function openFilters(){
  viewingFilters=true; currentCat=null; currentBrand=null; currentFilterType=null; setTab('filters');
  document.getElementById('app').innerHTML=`
    <h1>🔧 ФИЛЬТРА</h1>
    <p style="color:#888;margin:8px 0 16px">Что проверяем?</p>
    <button class="choice-btn" onclick="openFilterType('air')"><span>💨</span> ВОЗДУШНЫЕ</button>
    <button class="choice-btn" onclick="openFilterType('cabin')"><span>🌬️</span> САЛОННЫЕ</button>
    <p style="text-align:center;color:#555;font-size:11px;margin-top:10px">Нажми на нужный тип — откроется отдельная таблица</p>`;
}
async function openFilterType(type, force=false){
  currentFilterType=type; viewingFilters=true; currentCat=null; currentBrand=null; setTab('filters');
  // БЫСТРО: если уже качали этот тип - сразу из кэша, без запроса
  if(cacheFilters[type] && !force){ drawFilters(type, cacheFilters[type]); return; }
  try{
    // БЫСТРО: качаем только нужный тип, а не все фильтры. Старые без типа подхватываем отдельно.
    let list=[];
    if(type==='air' || type==='cabin'){
      const snap = await withTimeout(db.collection('filters').where('type','==',type).get(),4000);
      snap.forEach(d=>list.push({docId:d.id, ...d.data()}));
      // Старые без типа - показываем и там, и там как раньше, но качаем их только 1 раз
      if(!cacheFilters['old']){
        const oldSnap = await withTimeout(db.collection('filters').get(),4000);
        let olds=[]; oldSnap.forEach(d=>{ if(!d.data().type) olds.push({docId:d.id, ...d.data()}); });
        cacheFilters['old']=olds;
      }
      list = list.concat(cacheFilters['old']||[]);
    } else {
      const snap = await withTimeout(db.collection('filters').get(),4000);
      snap.forEach(d=>list.push({docId:d.id, ...d.data()}));
    }
    // ПО ПОРЯДКУ: натуральная сортировка
    list.sort((a,b)=>naturalCompare(a.name,b.name));
    cacheFilters[type]=list;
    drawFilters(type, list);
  }catch(e){
    document.getElementById('app').innerHTML=`<h2 style="color:#ff4444">Нет связи с базой фильтров</h2><p style="color:#888;margin:10px 0">${e.message}</p><button class="btn" onclick="openFilterType('${type}',true)">↻ Повторить</button>`;
  }
}
function drawFilters(type, list){
  const title = type==='air' ? '💨 ВОЗДУШНЫЕ' : '🌬️ САЛОННЫЕ';
  // Счетчики берем из кэша, не качаем заново
  const airCount = cacheFilters['air'] ? cacheFilters['air'].length : '...';
  const cabinCount = cacheFilters['cabin'] ? cacheFilters['cabin'].length : '...';
  document.getElementById('app').innerHTML=`<div class="brand-header"><h1>${title}</h1><div class="back-small" onclick="openFilters()">← выбрать тип</div></div>
    <div class="filter-switch"><button class="${type==='air'?'active':''}" onclick="openFilterType('air')">💨 ВОЗДУШНЫЕ (${airCount})</button><button class="${type==='cabin'?'active':''}" onclick="openFilterType('cabin')">🌬️ САЛОННЫЕ (${cabinCount})</button></div>
    <p style="color:#888;margin-bottom:8px">Позиций: ${list.length} • Всего на складе: <span id="totalQty">${list.reduce((s,f)=>s+(Number(f.qty)||0),0)}</span> шт</p>
    <input id="sFilter" oninput="filterFilters()" placeholder="Поиск фильтра..." style="width:100%;margin-top:8px;padding:8px">
    ${isAdmin?`<div class="admin-bar"><input id="fName" placeholder="Название фильтра (${type==='air'?'Воздушный':'Салонный'})" style="flex:1;min-width:180px"><input id="fQty" placeholder="Кол-во" type="number" style="width:80px" value="0"><button class="btn" id="addFBtn" onclick="addFilter()">+ Фильтр</button></div>`:''}
    <table><thead><tr><th style="width:50px">N°</th><th>Название</th><th style="width:170px;text-align:center">Количество</th>${isAdmin?`<th style="width:40px"></th>`:''}</tr></thead><tbody id="tbodyFilters">${list.map((f,i)=>{
      const qty = Number(f.qty)||0;
      const color = qty===4 ? '#00ff88' : qty>4 ? '#ffb400' : '#ff4444';
      return `<tr data-name="${(f.name||'').toLowerCase()}"><td>${i+1}</td><td style="font-weight:600">${f.name}</td><td style="text-align:center">${isAdmin?`<button class="qty-btn" onclick="changeQty('${f.docId}',-1)">−</button> <span class="qty-num" id="qty-${f.docId}" style="color:${color}">${qty}</span> <button class="qty-btn" onclick="changeQty('${f.docId}',1)">+</button>`:`<span class="qty-num" style="color:${color}">${qty}</span>`}</td>${isAdmin?`<td><button onclick="delFilter('${f.docId}')" style="background:none;border:none;color:#f44;cursor:pointer;font-weight:900">✕</button></td>`:''}</tr>`;
    }).join('') || `<tr><td colspan="4" style="text-align:center;color:#888;padding:16px">Пока нет фильтров в этом разделе.</td></tr>`}</tbody></table>`;
}
function filterFilters(){const q=document.getElementById('sFilter').value.toLowerCase();document.querySelectorAll('#tbodyFilters tr').forEach(tr=>{ if(!tr.dataset.name) return; tr.style.display=tr.dataset.name.includes(q)?'':'none' })}
async function addFilter(){
  const btn=document.getElementById('addFBtn'); if(btn) btn.disabled=true;
  const n=document.getElementById('fName').value.trim();
  const q=parseInt(document.getElementById('fQty').value)||0;
  if(!n){ if(btn) btn.disabled=false; return; }
  const docRef = await db.collection('filters').add({name:n, qty:q, type: currentFilterType || 'air', created:Date.now()});
  // БЫСТРО: добавляем в кэш и перерисовываем без перезагрузки из базы
  if(!cacheFilters[currentFilterType]) cacheFilters[currentFilterType]=[];
  cacheFilters[currentFilterType].push({docId:docRef.id, name:n, qty:q, type: currentFilterType || 'air'});
  cacheFilters[currentFilterType].sort((a,b)=>naturalCompare(a.name,b.name));
  drawFilters(currentFilterType, cacheFilters[currentFilterType]);
}
async function changeQty(docId, delta){
  // БЫСТРО: цифра меняется сразу, в базу уходит в фоне, таблицу не перезагружаем
  const el=document.getElementById('qty-'+docId);
  if(!el) return;
  let qty=parseInt(el.textContent)||0; qty+=delta; if(qty<0) qty=0;
  el.textContent=qty;
  el.style.color = qty===4 ? '#00ff88' : qty>4 ? '#ffb400' : '#ff4444';
  const totalEl=document.getElementById('totalQty'); if(totalEl) totalEl.textContent = parseInt(totalEl.textContent||'0')+delta;
  const list=cacheFilters[currentFilterType]||[]; const f=list.find(x=>x.docId===docId); if(f) f.qty=qty;
  db.collection('filters').doc(docId).update({qty:qty}).catch(()=>{});
}
async function delFilter(docId){ if(!confirm('Удалить фильтр?')) return; await db.collection('filters').doc(docId).delete(); if(cacheFilters[currentFilterType]) cacheFilters[currentFilterType]=cacheFilters[currentFilterType].filter(f=>f.docId!==docId); cacheFilters['old']=null; drawFilters(currentFilterType, cacheFilters[currentFilterType]||[]); }

// НОВЫЙ АДМИН
async function toggleAdmin(){
  if(isAdmin){ await auth.signOut(); return; }
  let email = prompt("Email админа:");
  if(!email) return;
  let pass = prompt("Пароль:");
  if(!pass) return;
  try{ await auth.signInWithEmailAndPassword(email.trim(), pass); }catch(e){ alert("Неверный email или пароль: " + e.message); }
}
auth.onAuthStateChanged(user=>{
  isAdmin = !!user;
  document.getElementById('adminBtn').innerText = isAdmin ? 'Выйти ('+user.email+')' : 'Адм';
  if(!authReady){ authReady=true; return; }
  if(viewingFilters){
    if(currentFilterType) openFilterType(currentFilterType, true);
    else openFilters();
  }
  else if(currentBrand) openBrand(currentBrand);
  else if(currentCat) openCategory(currentCat.id);
  else renderCategories(true);
});
window.onload=()=>{ load(); };
</script>
