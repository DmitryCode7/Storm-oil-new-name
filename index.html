function setTab(active){
  document.getElementById('tabCatBtn').classList.toggle('active', active==='cat');
  document.getElementById('tabFiltBtn').classList.toggle('active', active==='filters');
}

async function migrateIfNeeded(){
  const oldRef = await db.collection('storm').doc('data').get();
  if(!oldRef.exists) return false;
  if(localStorage.getItem('migrated_v2')==='1') return false;
  const old = oldRef.data();
  if(!old.categories) return false;
  document.getElementById('app').innerHTML = `<h2>Идет перенос старой базы... Не закрывай</h2>`;
  let count=0;
  const batch = db.batch();
  for(let c of old.categories){
    const ref = db.collection('categories').doc(String(c.id));
    batch.set(ref, c);
    const brands = old.brands[c.id] || [];
    for(let b of brands){
      const bRef = db.collection('brands').doc(`${c.id}_${b}`);
      batch.set(bRef, {name:b, categoryId:c.id});
    }
  }
  await batch.commit();
  let batch2 = db.batch(); let i=0;
  for(let key in old.products){
    for(let p of old.products[key]){
      const parts = key.split('_');
      const catId = parseInt(parts[0]);
      const brand = key.substring(String(catId).length+1);
      const pRef = db.collection('products').doc(String(p.id));
      batch2.set(pRef, {name:p.name, volume:p.volume, price:p.price, categoryId:catId, brand:brand, id:p.id});
      count++; i++;
      if(i>400){ await batch2.commit(); batch2=db.batch(); i=0; }
    }
  }
  if(i>0) await batch2.commit();
  localStorage.setItem('migrated_v2','1');
  document.getElementById('app').innerHTML = `<h2 style="color:#00ff88">Перенос готов! Перенесено ${count} товаров</h2><p style="margin-top:10px">Старая база сохранена как резерв. Теперь сайт безлимитный.</p><button class="btn" style="margin-top:12px" onclick="load()">Продолжить</button>`;
  return true;
}

async function load(){
  const migrated = await migrateIfNeeded();
  if(migrated) return;
  renderCategories();
}
async function renderCategories(){
  currentCat=null; currentBrand=null; viewingFilters=false; currentFilterType=null; setTab('cat');
  const snap = await db.collection('categories').get();
  let cats = [];
  if(snap.empty){
    const defaults=[{id:1,name:'Моторное масло',icon:'🚗'},{id:2,name:'Дизельное масло',icon:'🚛'},{id:3,name:'Трансмиссионное масло',icon:'⚙️'},{id:4,name:'Гидравлическое масло',icon:'💧'},{id:5,name:'Компрессорное масло',icon:'🌀'},{id:6,name:'Автохимия',icon:'🧪'},{id:7,name:'Смазки',icon:'🧴'},{id:8,name:'Мото масло',icon:'🏍️'},{id:9,name:'Антифриз',icon:'❄️'}];
    for(let c of defaults){ await db.collection('categories').doc(String(c.id)).set(c); cats.push(c); }
  } else { snap.forEach(d=>cats.push(d.data())); }
  cats.sort((a,b)=>a.id-b.id);
  document.getElementById('app').innerHTML=`<h1>Категории • ${cats.length}</h1>${isAdmin?`<div class="admin-bar"><input id="newCat" placeholder="Новая категория"><button class="btn" onclick="addCategory()">+ Добавить</button></div>`:''}<div class="grid">${cats.map(c=>`<div class="card" onclick="openCategory(${c.id})"><div class="icon">${c.icon||'📦'}</div><div class="cat-name">${c.name}</div>${isAdmin?`<button class="del" style="top:6px;right:7px;width:22px;height:22px" onclick="event.stopPropagation();delCategory(${c.id})">✕</button>`:''}</div>`).join('')}</div>`;
}
